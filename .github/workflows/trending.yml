name: Trending Digest

on:
  schedule:
    - cron: "7 1 * * *"     # 09:07 Asia/Shanghai, daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: trending-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build digest (star snapshot + diff + github.com/trending)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/trending.py

      - name: Commit as repo owner and push
        env:
          AUTHOR_NAME: Suzanneisgenius
          AUTHOR_EMAIL: 180459943+Suzanneisgenius@users.noreply.github.com
        run: |
          git config user.name  "$AUTHOR_NAME"
          git config user.email "$AUTHOR_EMAIL"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "trending: $(TZ=Asia/Shanghai date +'%Y-%m-%d') digest"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
